name: Cookbook examples

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cookbook-examples-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkpoint-example:
    name: Checkpoint example (Node.js 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/01-checkpoint-quest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run dependency-free tests
        run: npm test
